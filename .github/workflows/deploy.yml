name: Validate, publish and deploy Protocol OSI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: protocol-osi-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate routes, lessons and laboratory
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build application and versioned PWA cache
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production container for validation
        run: docker build --tag protocol-osi-lab:ci-${{ github.sha }} .

      - name: Run browser and security tests against hardened Nginx image
        run: bash scripts/test-production-container.sh protocol-osi-lab:ci-${{ github.sha }}

  publish:
    name: Build and publish immutable image
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push validated commit
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mralonsocorona/protocol-osi-lab:sha-${{ github.sha }}
            ghcr.io/mralonsocorona/protocol-osi-lab:latest
          labels: |
            org.opencontainers.image.source=https://github.com/mralonsocorona/protocol-osi-lab
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy exact commit to Contabo
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy, verify HTTPS and roll back on failure
        env:
          DEPLOY_VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          DEPLOY_VPS_PORT: ${{ secrets.DEPLOY_VPS_PORT }}
          DEPLOY_VPS_USER: ${{ secrets.DEPLOY_VPS_USER }}
          DEPLOY_VPS_SSH_KEY: ${{ secrets.DEPLOY_VPS_SSH_KEY }}
          DEPLOY_VPS_KNOWN_HOSTS: ${{ secrets.DEPLOY_VPS_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/deploy-production.sh
